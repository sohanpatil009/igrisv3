[package]
name = "handfree_mouse"
version = "0.1.0"
edition = "2021"

[lib]
name = "handfree_mouse"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Python FFI
pyo3 = { version = "0.20", features = ["extension-module"] }

# Mouse/Keyboard control
enigo = "0.2"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"

[build-dependencies]
pyo3-build-config = "0.20"
